name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks, race tests and deployment configuration
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          go install filippo.io/age/cmd/...@v1.2.1
          bash scripts/check.sh
      - name: Local ACME lifecycle (no public DNS or public CA)
        run: ACME_TEST_NATIVE=1 bash scripts/test-acme.sh
      - name: Dependency audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Build release images
        run: |
          docker build -t apex-redirect:ci .
          docker build -f deploy/Caddy.source.Dockerfile -t apex-caddy:ci .
      - name: Smoke test hardened Caddy runtime
        run: |
          install -d -m 0700 "$RUNNER_TEMP/caddy"
          container=$(
            docker run -d --network host --read-only --user 0:0 \
              --cap-drop ALL --cap-add NET_BIND_SERVICE \
              --security-opt no-new-privileges:true \
              --memory 512m --pids-limit 256 \
              -e ACME_EMAIL=ci@example.invalid \
              -e CADDY_STORAGE=/var/lib/caddy \
              -e XDG_DATA_HOME=/var/lib/caddy \
              -e XDG_CONFIG_HOME=/var/lib/caddy/config \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$RUNNER_TEMP/caddy:/var/lib/caddy" \
              apex-caddy:ci run --config /etc/caddy/Caddyfile --adapter caddyfile
          )
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused http://127.0.0.1:2019/config/ >/dev/null
          test "$(docker inspect --format '{{.State.Status}}' "$container")" = running
      - name: Scan release images
        run: bash scripts/scan-images.sh apex-redirect:ci apex-caddy:ci
