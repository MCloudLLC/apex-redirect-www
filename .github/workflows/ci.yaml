name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Static checks, race tests and deployment configuration
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          go install filippo.io/age/cmd/...@v1.2.1
          bash scripts/check.sh
      - name: Local ACME lifecycle (no public DNS or public CA)
        run: ACME_TEST_NATIVE=1 bash scripts/test-acme.sh
      - name: Dependency audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Build source image
        run: docker build -t apex-redirect:ci .
      - name: Scan application image
        run: bash scripts/scan-images.sh apex-redirect:ci
