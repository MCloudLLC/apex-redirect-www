name: publish images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and scan before publishing
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$prefix:$GITHUB_REF_NAME" -t "$prefix:latest" .
          docker build -f deploy/Caddy.source.Dockerfile \
            -t "$prefix-caddy:$GITHUB_REF_NAME" -t "$prefix-caddy:latest" .
          bash scripts/scan-images.sh "$prefix:$GITHUB_REF_NAME" "$prefix-caddy:$GITHUB_REF_NAME"
      - name: Publish MCloudLLC images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$prefix:$GITHUB_REF_NAME"
          docker push "$prefix:latest"
          docker push "$prefix-caddy:$GITHUB_REF_NAME"
          docker push "$prefix-caddy:latest"
          printf 'Published `%s:%s` and `%s-caddy:%s`\n' \
            "$prefix" "$GITHUB_REF_NAME" "$prefix" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
