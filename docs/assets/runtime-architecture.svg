<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="runtime-title runtime-desc">
  <title id="runtime-title">Apex redirect runtime architecture</title>
  <desc id="runtime-desc">Traffic flow from customer apex DNS through a stable public IP and Caddy to the private Go redirect and control listeners, DNS policy, and SQLite admission state. Caddy asks the control listener for certificate authorization. WWW traffic goes separately to the external website host. The service returns HTTP 301 redirects preserving path and query and never proxies website content.</desc>
  <defs>
    <linearGradient id="runtime-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#102b40"/>
    </linearGradient>
    <linearGradient id="runtime-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132d46"/>
      <stop offset="1" stop-color="#0c2035"/>
    </linearGradient>
    <linearGradient id="runtime-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="runtime-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="runtime-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1400" height="920" rx="26" fill="url(#runtime-bg)"/>
  <path d="M0 145C260 90 430 190 700 128s470-63 700 8v-136H0z" fill="#164e63" opacity="0.16"/>
  <circle cx="1258" cy="112" r="160" fill="#22d3ee" opacity="0.045"/>
  <circle cx="132" cy="836" r="210" fill="#4ade80" opacity="0.035"/>

  <text x="70" y="72" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Apex redirect runtime</text>
  <text x="70" y="107" fill="#9fb6c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A narrow, fail-closed redirect path with private application state</text>
  <g transform="translate(1105 52)">
    <rect width="225" height="48" rx="24" fill="#09283a" stroke="#22d3ee" stroke-opacity="0.55"/>
    <path d="M24 29v-8a8 8 0 0116 0v8M21 28h22v13H21z" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="56" y="31" fill="#cffafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Redirect-only service</text>
  </g>

  <!-- Main request path -->
  <g filter="url(#runtime-shadow)">
    <rect x="55" y="175" width="230" height="180" rx="22" fill="url(#runtime-card)" stroke="#28506d"/>
    <circle cx="105" cy="232" r="30" fill="#082f49" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="105" cy="232" r="20" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <path d="M85 232h40M105 212c7 7 10 13 10 20s-3 13-10 20M105 212c-7 7-10 13-10 20s3 13 10 20" fill="none" stroke="#67e8f9" stroke-width="1.8"/>
    <text x="148" y="222" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Customer</text>
    <text x="148" y="248" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Browser / client</text>
    <rect x="78" y="282" width="184" height="46" rx="10" fill="#0b253b"/>
    <text x="170" y="302" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">https://example.com</text>
    <text x="170" y="320" text-anchor="middle" fill="#b8cedc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">/path?query=kept</text>
  </g>

  <g filter="url(#runtime-shadow)">
    <rect x="355" y="175" width="230" height="180" rx="22" fill="url(#runtime-card)" stroke="#28506d"/>
    <rect x="381" y="204" width="56" height="56" rx="14" fill="#082f49" stroke="#22d3ee"/>
    <path d="M392 220h34M392 231h27M392 242h31" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="427" cy="220" r="3" fill="#4ade80"/>
    <circle cx="420" cy="231" r="3" fill="#4ade80"/>
    <circle cx="424" cy="242" r="3" fill="#4ade80"/>
    <text x="458" y="222" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Apex DNS</text>
    <text x="458" y="248" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Authoritative records</text>
    <rect x="380" y="282" width="180" height="46" rx="10" fill="#0b253b"/>
    <text x="470" y="302" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">A + AAAA</text>
    <text x="470" y="320" text-anchor="middle" fill="#b8cedc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">stable public address</text>
  </g>

  <g filter="url(#runtime-shadow)">
    <rect x="655" y="175" width="210" height="180" rx="22" fill="url(#runtime-card)" stroke="#28506d"/>
    <circle cx="702" cy="232" r="29" fill="#082f49" stroke="#22d3ee"/>
    <path d="M688 244l14-27 14 27h-28zM694 236h16" fill="none" stroke="#67e8f9" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="744" y="222" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Public IP</text>
    <text x="744" y="248" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Stable ingress</text>
    <rect x="680" y="282" width="160" height="46" rx="10" fill="#0b253b"/>
    <text x="760" y="302" text-anchor="middle" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">TCP 80 / 443</text>
    <text x="760" y="320" text-anchor="middle" fill="#b8cedc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">internet-facing only</text>
  </g>

  <g filter="url(#runtime-shadow)">
    <rect x="935" y="152" width="410" height="226" rx="24" fill="#102b43" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="958" y="174" width="364" height="56" rx="14" fill="#0b3548"/>
    <path d="M981 207v-10a10 10 0 0120 0v10M977 206h28v17h-28z" fill="none" stroke="#67e8f9" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="1020" y="199" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Caddy edge</text>
    <text x="1020" y="219" fill="#b8cedc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Ports 80 / 443 · on-demand TLS</text>
    <rect x="958" y="248" width="174" height="102" rx="14" fill="#0b2136" stroke="#31526b"/>
    <path d="M980 280h26l8 8v31h-34z" fill="none" stroke="#fb923c" stroke-width="2"/>
    <path d="M1006 280v9h8M987 300h20M987 309h16" stroke="#fdba74" stroke-width="1.8"/>
    <text x="1025" y="278" fill="#fed7aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">TLS certificate</text>
    <text x="1025" y="300" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">managed issuance</text>
    <text x="1025" y="321" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">and renewal</text>
    <rect x="1148" y="248" width="174" height="102" rx="14" fill="#0b2136" stroke="#31526b"/>
    <path d="M1172 286v-7a8 8 0 0116 0v7M1168 285h24v20h-24z" fill="none" stroke="#4ade80" stroke-width="2.2"/>
    <circle cx="1180" cy="294" r="2.4" fill="#86efac"/>
    <text x="1200" y="278" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Protected storage</text>
    <text x="1200" y="300" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Caddy state + keys</text>
    <text x="1200" y="321" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">durable permissions</text>
  </g>

  <path d="M285 265H344" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M585 265H644" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M865 265H924" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <text x="320" y="246" text-anchor="middle" fill="#93c5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">resolve</text>
  <text x="620" y="246" text-anchor="middle" fill="#93c5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">route</text>
  <text x="895" y="246" text-anchor="middle" fill="#93c5d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">TLS</text>

  <!-- Loopback trust boundary -->
  <rect x="370" y="438" width="975" height="300" rx="28" fill="#071827" fill-opacity="0.78" stroke="#4ade80" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="395" y="421" width="244" height="36" rx="18" fill="#123b31" stroke="#4ade80"/>
  <path d="M415 442v-8a7 7 0 0114 0v8M412 441h20v12h-20z" fill="none" stroke="#86efac" stroke-width="2"/>
  <text x="446" y="445" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Private loopback boundary</text>
  <text x="1310" y="460" text-anchor="end" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">127.0.0.1 only</text>

  <g filter="url(#runtime-shadow)">
    <rect x="420" y="493" width="300" height="190" rx="20" fill="url(#runtime-card)" stroke="#35624f"/>
    <circle cx="468" cy="545" r="28" fill="#113b35" stroke="#4ade80"/>
    <path d="M455 545l9 9 18-20" fill="none" stroke="#86efac" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="536" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Go policy service</text>
    <text x="510" y="562" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">HTTP :8080 · control :8081</text>
    <rect x="444" y="590" width="252" height="66" rx="12" fill="#0a2a2b"/>
    <text x="570" y="614" text-anchor="middle" fill="#86efac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">HTTP 301 → www host</text>
    <text x="570" y="639" text-anchor="middle" fill="#d1fae5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">preserves path + query</text>
  </g>

  <g filter="url(#runtime-shadow)">
    <rect x="765" y="493" width="250" height="190" rx="20" fill="url(#runtime-card)" stroke="#28506d"/>
    <rect x="790" y="518" width="52" height="52" rx="13" fill="#082f49" stroke="#22d3ee"/>
    <path d="M801 535h30M801 545h22M801 555h27" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="860" y="536" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">DNS policy</text>
    <text x="860" y="562" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Admission checks</text>
    <text x="790" y="608" fill="#cfe3ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">• hostname allow / deny</text>
    <text x="790" y="635" fill="#cfe3ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">• resolver-backed decision</text>
  </g>

  <g filter="url(#runtime-shadow)">
    <rect x="1060" y="493" width="240" height="190" rx="20" fill="url(#runtime-card)" stroke="#28506d"/>
    <ellipse cx="1103" cy="532" rx="24" ry="9" fill="#123d50" stroke="#67e8f9" stroke-width="2"/>
    <path d="M1079 532v39c0 5 11 9 24 9s24-4 24-9v-39M1079 551c0 5 11 9 24 9s24-4 24-9" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <text x="1142" y="536" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">SQLite state</text>
    <text x="1142" y="562" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Local + protected</text>
    <rect x="1083" y="601" width="194" height="50" rx="11" fill="#0b253b"/>
    <text x="1180" y="622" text-anchor="middle" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">block + admission</text>
    <text x="1180" y="642" text-anchor="middle" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">durable decisions</text>
  </g>

  <path d="M1138 378v50H570v54" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="875" y="418" text-anchor="middle" fill="#9beab7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">redirect traffic + private /ask authorization</text>
  <path d="M720 588H754" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M1015 588H1049" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>

  <!-- Supporting external services -->
  <g filter="url(#runtime-shadow)">
    <rect x="55" y="450" width="260" height="122" rx="20" fill="url(#runtime-card)" stroke="#7c4a2a"/>
    <path d="M82 481h38l12 12v45H82z" fill="none" stroke="#fb923c" stroke-width="2.3"/>
    <path d="M120 481v13h12M91 509h30M91 519h24" stroke="#fdba74" stroke-width="2"/>
    <text x="151" y="493" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ACME CA</text>
    <text x="151" y="520" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Certificate issuance</text>
    <text x="151" y="542" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">and renewal</text>
  </g>
  <path d="M315 510H340V335H925" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/>

  <g filter="url(#runtime-shadow)">
    <rect x="55" y="602" width="260" height="122" rx="20" fill="url(#runtime-card)" stroke="#28506d"/>
    <circle cx="106" cy="655" r="28" fill="#082f49" stroke="#22d3ee"/>
    <path d="M91 648h30M91 658h23M91 668h27" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="151" y="645" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Trusted resolvers</text>
    <text x="151" y="672" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">DNS answers used by</text>
    <text x="151" y="694" fill="#b4c8d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">admission policy</text>
  </g>
  <path d="M315 663H354V638H754" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-cyan)"/>

  <!-- Separate WWW path -->
  <g filter="url(#runtime-shadow)">
    <rect x="55" y="790" width="1290" height="82" rx="22" fill="#0b2236" stroke="#31526b"/>
    <rect x="76" y="808" width="190" height="46" rx="12" fill="#102f45"/>
    <text x="171" y="837" text-anchor="middle" fill="#bae6fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">www.example.com</text>
    <path d="M282 831H1015" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <text x="648" y="817" text-anchor="middle" fill="#8eb4c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">separate DNS and content-serving path</text>
    <circle cx="1064" cy="831" r="24" fill="#082f49" stroke="#22d3ee"/>
    <path d="M1048 838c8-22 25-22 33 0M1051 823h26M1064 813v35" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <text x="1103" y="826" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">External website host</text>
    <text x="1103" y="849" fill="#a9c0d2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">owns and serves all site content</text>
  </g>

  <g transform="translate(870 704)">
    <rect width="430" height="48" rx="14" fill="#381b20" stroke="#fb7185"/>
    <path d="M22 14l16 16M38 14L22 30" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <text x="55" y="30" fill="#fecdd3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">No website content proxying or origin forwarding</text>
  </g>
</svg>
